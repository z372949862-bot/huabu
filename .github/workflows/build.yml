name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --publish always
      - name: Verify latest.yml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "=== Release files ==="
          dir release\*.exe release\*.yml release\*.blockmap 2>nul
          if exist release\latest.yml (echo latest.yml EXISTS) else (echo latest.yml MISSING)
